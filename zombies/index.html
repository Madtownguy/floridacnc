  </head>
  <body>
    <div id="app">
      <canvas id="view" aria-label="Battlefield"></canvas>
      <div id="hurt"></div>
      <header id="topbar" hidden>
        <div class="bar">
          <div class="brand">Dead Acre</div>
          <div class="stats">
            <span class="stat lives"><span class="k">Lives</span> <b id="lives">0</b><span class="of" id="lives-max">/0</span></span>
            <span class="stat wave"><span class="k">Wave</span> <b id="wave">0/15</b></span>
            <span class="stat cash"><span class="k">Cash</span> <b id="cash">$0</b></span>
            <span class="stat score"><span class="k">Score</span> <b id="score">0</b></span>
          </div>
          <div class="toggles">
            <button id="btn-speed" type="button" aria-label="Game speed">1×</button>
            <button id="btn-pause" type="button" aria-label="Pause">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.2" height="12" rx="1"/><rect x="9.8" y="2" width="3.2" height="12" rx="1"/></svg>
            </button>
            <button id="btn-mute" type="button" aria-label="Mute sound" aria-pressed="false"></button>
          </div>
        </div>
        <div id="pips" class="pips"></div>
      </header>
      <div id="stage">
        <div id="banner" hidden>
          <strong id="banner-title"></strong>
          <span id="banner-sub"></span>
        </div>
        <div id="toast" hidden></div>
        <div id="hint" hidden>
          <p>Tap a tower, then a lit slot beside the road.</p>
          <button id="hint-ok" type="button">Got it</button>
        </div>
      </div>
      <footer id="dock" hidden>
        <button id="call" type="button" hidden>
          <span id="call-title">Send wave</span>
          <span id="call-sub"></span>
          <span id="call-note"></span>
        </button>
        <div id="cards"></div>
        <div id="inspect" hidden></div>
      </footer>
      <div id="menu">
        <div class="menu-top">
          <p class="eyebrow">Tower defense</p>
          <h1>Dead Acre</h1>
          <p class="tag">Hold the bunker. Dawn is fifteen waves out.</p>
          <p id="menu-best" class="best"></p>
        </div>
        <div class="sheet">
          <div id="map-choices" class="maps"></div>
          <button id="play" class="primary" type="button">Defend this map</button>
          <button id="menu-mute" class="ghost" type="button">Sound on</button>
        </div>
      </div>
      <div id="pause" class="overlay" hidden>
        <div class="sheet">
          <p class="eyebrow">Paused</p>
          <h2>The dead can wait</h2>
          <div class="keys">
            <p>1–4 pick a tower. Enter sends the wave. U upgrades, Delete sells. F toggles speed. M mutes.</p>
          </div>
          <button id="pause-resume" class="primary" type="button">Resume</button>
          <div class="row">
            <button id="pause-mute" class="ghost" type="button">Sound</button>
            <button id="pause-leave" class="ghost danger" type="button">Leave</button>
          </div>
        </div>
      </div>
      <div id="end" class="overlay" hidden>
        <div class="sheet">
          <p id="end-kicker" class="eyebrow"></p>
          <h2 id="end-title"></h2>
          <p id="end-body"></p>
          <dl id="end-stats" class="stats-list"></dl>
          <button id="end-retry" class="primary" type="button">Play again</button>
          <button id="end-menu" class="ghost" type="button">Maps</button>
        </div>
      </div>
    </div>
  </body>
</html>
